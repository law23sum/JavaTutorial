plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.3'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.framework'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories { mavenCentral() }

dependencies {
    // --- Spring Boot app deps
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly   'com.h2database:h2'

    // --- Spring Boot test stack (kept; mainly JUnit/MockMvc)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // --- Your existing tutorial/testing stack
    testImplementation 'junit:junit:4.13.2'                         // optional; TestNG is primary below
    testImplementation 'org.testng:testng:7.10.2'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.23.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.9.2'
}

test {
    // run TestNG tests
    useTestNG()

    // pass-through system properties (as before)
    systemProperty 'env',     System.getProperty('env', 'local')
    systemProperty 'browser', System.getProperty('browser', 'chrome')

    // reports (explicit)
    reports {
        html.required.set(true)
        junitXml.required.set(true)
    }
}

/**
 * Optional but nice: make the main class explicit for IDEs and custom tooling.
 * Spring Boot will auto-detect @SpringBootApplication if this is omitted.
 */
springBoot {
    mainClass = 'com.framework.spring.SpringApp'
}

/**
 * If you still want your original JavaExec runners,
 * you can keep them alongside Boot. Uncomment to restore.
