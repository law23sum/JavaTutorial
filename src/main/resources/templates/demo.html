<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Java Tutorial Demo Explorer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 1.5rem;
            background: #1e293b;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        header h1 {
            margin: 0 0 0.5rem;
            font-size: clamp(1.5rem, 2vw, 2rem);
        }
        header p {
            margin: 0;
            color: #94a3b8;
        }
        main {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(240px, 340px) 1fr;
            gap: 1rem;
            padding: 1rem;
        }
        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
        }
        aside, section {
            background: #1e293b;
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
        }
        .list-header {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .list-header input {
            padding: 0.6rem 0.75rem;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: #e2e8f0;
        }
        .list-header input::placeholder {
            color: #64748b;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
            overflow-y: auto;
        }
        li {
            margin-bottom: 0.5rem;
        }
        li:last-child {
            margin-bottom: 0;
        }
        .demo-option {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid transparent;
            background: #0f172a;
            color: inherit;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s ease, transform 0.1s ease, border-color 0.2s ease;
            font-size: 0.95rem;
        }
        .demo-option:hover {
            background: #15213a;
            transform: translateX(2px);
            border-color: #334155;
        }
        .demo-option.active {
            background: #334155;
            border-color: #38bdf8;
            box-shadow: inset 0 0 0 1px rgba(56,189,248,0.4);
        }
        .demo-option small {
            display: block;
            margin-top: 0.25rem;
            color: #94a3b8;
            font-size: 0.8rem;
        }
        section h2 {
            margin: 0 0 0.75rem;
        }
        .status {
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .panel-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        pre {
            background: #0f172a;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            min-height: 150px;
            white-space: pre-wrap;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        button.primary {
            align-self: flex-start;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 999px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }
        button.primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.35);
        }
        button.primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }
        .tagline {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.25rem 0.6rem;
            background: rgba(56,189,248,0.15);
            border-radius: 999px;
            color: #bae6fd;
            font-size: 0.8rem;
        }
        .error {
            color: #fda4af;
            font-size: 0.9rem;
        }
        .empty-state {
            border: 1px dashed #334155;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            color: #94a3b8;
        }
    </style>
</head>
<body>
<div id="root"></div>
<script th:inline="javascript">
    window.__demoCount = [[${demoCount}]];
</script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script type="module">
    const { useEffect, useMemo, useState } = React;

    function App() {
        const [demos, setDemos] = useState([]);
        const [filter, setFilter] = useState("");
        const [selectedId, setSelectedId] = useState(null);
        const [statusMessage, setStatusMessage] = useState(() => {
            const count = typeof window.__demoCount === "number" ? window.__demoCount : null;
            return count != null
                ? `Server discovered ${count} main class${count === 1 ? "" : "es"} at startup.`
                : "Loading demos...";
        });
        const [output, setOutput] = useState("");
        const [running, setRunning] = useState(false);
        const [error, setError] = useState("");

        useEffect(() => {
            let cancelled = false;
            async function loadDemos() {
                try {
                    setStatusMessage("Loading demos...");
                    const response = await fetch("/api/demos");
                    if (!response.ok) {
                        throw new Error("Failed to fetch demos");
                    }
                    const payload = await response.json();
                    if (cancelled) {
                        return;
                    }
                    setDemos(payload);
                    if (payload.length === 0) {
                        setStatusMessage("No runnable main classes were discovered.");
                        setSelectedId(null);
                    } else {
                        setStatusMessage(`${payload.length} main class${payload.length === 1 ? "" : "es"} ready to launch.`);
                        setSelectedId(payload[0].id);
                        setOutput("Select a demo to view its details and run it.");
                    }
                } catch (ex) {
                    if (!cancelled) {
                        console.error(ex);
                        setStatusMessage("Failed to load demos. Check server logs.");
                        setError("Unable to reach the demo API.");
                    }
                }
            }
            loadDemos();
            return () => {
                cancelled = true;
            };
        }, []);

        const filtered = useMemo(() => {
            const keyword = filter.trim().toLowerCase();
            if (!keyword) {
                return demos;
            }
            return demos.filter((demo) => {
                return demo.name.toLowerCase().includes(keyword) || demo.id.toLowerCase().includes(keyword);
            });
        }, [demos, filter]);

        useEffect(() => {
            if (filtered.length === 0) {
                if (selectedId !== null) {
                    setSelectedId(null);
                }
                return;
            }
            const stillVisible = filtered.some((demo) => demo.id === selectedId);
            if (!stillVisible) {
                setSelectedId(filtered[0].id);
            }
        }, [filtered, selectedId]);

        const selected = useMemo(() => {
            if (!selectedId) {
                return null;
            }
            return filtered.find((demo) => demo.id === selectedId) || demos.find((demo) => demo.id === selectedId) || null;
        }, [filtered, demos, selectedId]);

        async function handleRun() {
            if (!selected) {
                return;
            }
            setRunning(true);
            setError("");
            setOutput("Capturing output...");
            try {
                const response = await fetch(`/api/demos/${encodeURIComponent(selected.id)}/run`, {
                    method: "POST"
                });
                if (!response.ok) {
                    throw new Error("Failed to run demo");
                }
                const payload = await response.json();
                const text = payload.output ? String(payload.output).trim() : "";
                setOutput(text.length > 0 ? text : "(No output produced)");
            } catch (ex) {
                console.error(ex);
                setError("Demo execution failed. Check server logs.");
                setOutput("");
            } finally {
                setRunning(false);
            }
        }

        function renderList() {
            if (filtered.length === 0) {
                return (
                    React.createElement("div", { className: "empty-state" },
                        "No demos match this filter."
                    )
                );
            }
            return (
                React.createElement("ul", null,
                    filtered.map((demo) =>
                        React.createElement("li", { key: demo.id },
                            React.createElement("button", {
                                    type: "button",
                                    className: `demo-option${demo.id === selectedId ? " active" : ""}`,
                                    onClick: () => {
                                        setSelectedId(demo.id);
                                        setOutput("Select \"Run Demo\" to execute this main method.");
                                        setError("");
                                    }
                                },
                                React.createElement("strong", null, demo.name),
                                React.createElement("small", null, demo.id)
                            )
                        )
                    )
                )
            );
        }

        return (
            React.createElement("div", { className: "app-shell" },
                React.createElement("header", null,
                    React.createElement("span", { className: "tagline" }, "Launcher"),
                    React.createElement("h1", null, "Java Tutorial Main Explorer"),
                    React.createElement("p", null, statusMessage)
                ),
                React.createElement("main", null,
                    React.createElement("aside", null,
                        React.createElement("div", { className: "list-header" },
                            React.createElement("h2", { style: { margin: 0 } }, "Entry Points"),
                            React.createElement("input", {
                                type: "search",
                                placeholder: "Filter by name or class...",
                                value: filter,
                                onChange: (event) => setFilter(event.target.value)
                            })
                        ),
                        React.createElement("p", { className: "status" },
                            filtered.length === demos.length
                                ? `${demos.length} total`
                                : `${filtered.length} of ${demos.length} shown`
                        ),
                        renderList()
                    ),
                    React.createElement("section", null,
                        React.createElement("div", { className: "panel-body" },
                            selected ? (
                                React.createElement(React.Fragment, null,
                                    React.createElement("div", null,
                                        React.createElement("h2", { style: { margin: 0 } }, selected.name),
                                        React.createElement("p", { className: "status" }, selected.id)
                                    ),
                                    React.createElement("div", null,
                                        React.createElement("h3", { style: { margin: "0 0 0.5rem" } }, "Pseudo code"),
                                        React.createElement("pre", null, selected.pseudoCode.trim())
                                    ),
                                    React.createElement("button", {
                                        type: "button",
                                        className: "primary",
                                        onClick: handleRun,
                                        disabled: running
                                    }, running ? "Running..." : "Run Demo"),
                                    error ? React.createElement("p", { className: "error" }, error) : null,
                                    React.createElement("div", null,
                                        React.createElement("h3", { style: { margin: "0 0 0.5rem" } }, "Output"),
                                        React.createElement("pre", null, output || "Run a demo to see output.")
                                    )
                                )
                            ) : (
                                React.createElement("div", { className: "empty-state" },
                                    "Select a demo from the list to inspect its details."
                                )
                            )
                        )
                    )
                )
            )
        );
    }

    const rootNode = document.getElementById("root");
    const root = ReactDOM.createRoot(rootNode);
    root.render(React.createElement(App));
</script>
</body>
</html>
